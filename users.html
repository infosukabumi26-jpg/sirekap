<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIREKAP Cloud | Manajemen User</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap4.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">
  <script src="config.js"></script>
  <script>
      // Role protection
      if(localStorage.getItem('sirekap_role') !== 'administrator') {
          alert('Akses Ditolak! Hanya Administrator yang boleh mengakses halaman ini.');
          window.location.href = 'index.html';
      }
  </script>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <!-- Navbar & Sidebar injected by layout.js -->

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Manajemen User</h1>
          </div>
        </div>
      </div>
    </div>

    <section class="content">
      <div class="container-fluid">
        <div class="card shadow-sm">
          <div class="card-header bg-white">
            <h3 class="card-title font-weight-bold mt-1">Daftar Pengguna Sistem</h3>
            <button class="btn btn-sm btn-primary float-right" id="btnAdd"><i class="fas fa-plus"></i> Tambah User</button>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table id="userTable" class="table table-bordered table-striped table-hover">
                <thead class="bg-light">
                  <tr>
                    <th>Username</th>
                    <th>Role (Hak Akses)</th>
                    <th width="150" class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="modal fade" id="formModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="modalTitle">Tambah User</h5>
        <button type="button" class="close text-white" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <form id="userForm">
        <div class="modal-body">
          <input type="hidden" name="id" id="userId">
          <input type="hidden" name="action" id="action" value="insert">
          
          <div class="form-group">
            <label>Username</label>
            <input type="text" class="form-control" name="username" id="username" required>
          </div>
          
          <div class="form-group">
            <label>Password <small class="text-danger" id="pwdHint">(Kosongkan jika tidak ingin mengubah password saat edit)</small></label>
            <input type="password" class="form-control" name="password" id="password">
          </div>
          
          <div class="form-group">
            <label>Hak Akses (Role)</label>
            <select class="form-control" name="role" id="role" required>
              <option value="petugas">Petugas</option>
              <option value="administrator">Administrator</option>
            </select>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-primary" id="btnSave"><i class="fas fa-save"></i> Simpan Data</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap4.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="layout.js"></script>

<script>
    var table;
    $(document).ready(function() {
        table = $('#userTable').DataTable({
            "responsive": true,
            "ajax": {
                "url": CONFIG.API_URL + "?table=users",
                "type": "GET",
                "dataSrc": function (json) {
                    if (json.status !== 'success') {
                        Swal.fire('Error', json.message || 'Gagal memuat data', 'error');
                        return [];
                    }
                    return json.data;
                }
            },
            "language": {
                "url": "//cdn.datatables.net/plug-ins/1.10.24/i18n/Indonesian.json"
            },
            "columns": [
                { "data": "username" },
                { "data": "role" },
                { 
                    "data": "id",
                    "className": "text-center", 
                    "orderable": false,
                    "render": function(data, type, row) {
                        return `
                            <button class="btn btn-xs btn-warning btn-edit" data-id="${data}" data-username="${row.username}" data-role="${row.role}"><i class="fas fa-edit"></i> Edit</button>
                            <button class="btn btn-xs btn-danger btn-delete" data-id="${data}"><i class="fas fa-trash"></i> Hapus</button>
                        `;
                    }
                }
            ]
        });

        $('#btnAdd').click(function() {
            $('#userForm')[0].reset();
            $('#userId').val('');
            $('#action').val('insert');
            $('#modalTitle').text('Tambah User Baru');
            $('#password').attr('required', true);
            $('#pwdHint').hide();
            $('#formModal').modal('show');
        });

        $('#userTable').on('click', '.btn-edit', function() {
            var id = $(this).data('id');
            var username = $(this).data('username');
            var role = $(this).data('role');
            
            $('#userForm')[0].reset();
            $('#userId').val(id);
            $('#action').val('update');
            $('#username').val(username);
            $('#role').val(role);
            $('#modalTitle').text('Edit Data User');
            
            $('#password').attr('required', false);
            $('#pwdHint').show();
            $('#formModal').modal('show');
        });

        $('#userForm').submit(function(e) {
            e.preventDefault();
            $('#btnSave').prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Menyimpan...');

            var action = $('#action').val();
            var reqData = {
                username: $('#username').val(),
                role: $('#role').val()
            };
            
            if ($('#password').val().trim() !== '') {
                reqData.password = $('#password').val();
            }

            var payload = {
                action: action,
                table: 'users',
                data: reqData
            };

            if(action === 'update') {
                payload.id = $('#userId').val();
            }

            fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
                if (res.status == 'success') {
                    $('#formModal').modal('hide');
                    table.ajax.reload(null, false);
                    Swal.fire({ icon: 'success', title: 'Berhasil!', timer: 2000, showConfirmButton: false });
                } else {
                    Swal.fire('Gagal!', res.message, 'error');
                }
            })
            .catch(err => Swal.fire('Error', err.toString(), 'error'))
            .finally(() => $('#btnSave').prop('disabled', false).html('<i class="fas fa-save"></i> Simpan Data'));
        });

        $('#userTable').on('click', '.btn-delete', function() {
            var id = $(this).data('id');
            Swal.fire({
                title: 'Apakah anda yakin?', text: "Data yang dihapus tidak dapat dikembalikan!", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6', confirmButtonText: 'Ya, hapus!', cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch(CONFIG.API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'delete', table: 'users', id: id })
                    })
                    .then(r => r.json())
                    .then(res => {
                        if (res.status == 'success') {
                            table.ajax.reload(null, false);
                            Swal.fire({ icon: 'success', title: 'Terhapus!', timer: 2000, showConfirmButton: false });
                        } else {
                            Swal.fire('Gagal!', res.message, 'error');
                        }
                    });
                }
            });
        });
    });
</script>
</body>
</html>
