<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIREKAP Cloud | Data Permohonan</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap4.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.bootstrap4.min.css">
  <!-- SweetAlert2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <!-- Theme style -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">

  <script src="config.js"></script>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <!-- Navbar and Sidebar injected by layout.js -->

  <!-- Content Wrapper -->
  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Data Permohonan Utama</h1>
          </div>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="card card-primary card-outline shadow-sm">
          <div class="card-header">
            <h3 class="card-title mt-1"><i class="fas fa-list"></i> Daftar Data</h3>
            <div class="card-tools">
              <button class="btn btn-sm btn-primary" onclick="showAddModal()"><i class="fas fa-plus"></i> Tambah Data</button>
              <button class="btn btn-sm btn-success" onclick="showImportModal()"><i class="fas fa-file-import"></i> Import CSV</button>
            </div>
          </div>
          <div class="card-body">
            <table id="dataTable" class="table table-bordered table-striped table-hover w-100">
              <thead style="background-color: #3bc2e9; color: black;">
              <tr>
                <th>NO</th>
                <th>TGL. PERMOHONAN</th>
                <th>NO. PERMOHONAN</th>
                <th>NAMA</th>
                <th>L/P</th>
                <th>TP</th>
                <th>TL</th>
                <th>KETERANGAN</th>
                <th>RECHECK</th>
                <th>STATUS CETAK</th>
                <th>AKSI</th>
              </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- Modal Form -->
<div class="modal fade" id="modal-form">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary">
        <h4 class="modal-title" id="modalTitle">Tambah Data Permohonan</h4>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="dataForm">
        <div class="modal-body">
            <input type="hidden" id="id" name="id">
            <input type="hidden" id="action" name="action" value="insert">
            <div class="form-group">
                <label>Tgl. Permohonan</label>
                <input type="date" class="form-control" id="tgl_permohonan" name="tgl_permohonan" required>
            </div>
            <div class="form-group">
                <label>No. Permohonan</label>
                <input type="text" class="form-control" id="no_permohonan" name="no_permohonan" required>
            </div>
            <div class="form-group">
                <label>Nama</label>
                <input type="text" class="form-control" id="nama" name="nama" required>
            </div>
            <div class="form-group">
                <label>Jenis Kelamin</label>
                <select class="form-control" id="jenis_kelamin" name="jenis_kelamin" required>
                    <option value="L">Laki-laki</option>
                    <option value="P">Perempuan</option>
                </select>
            </div>
            <div class="form-group">
                <div class="custom-control custom-checkbox d-inline mr-3">
                  <input class="custom-control-input" type="checkbox" id="tp" name="tp" value="1">
                  <label for="tp" class="custom-control-label">TP</label>
                </div>
                <div class="custom-control custom-checkbox d-inline">
                  <input class="custom-control-input" type="checkbox" id="tl" name="tl" value="1">
                  <label for="tl" class="custom-control-label">TL</label>
                </div>
            </div>
            <div class="form-group">
                <label>Keterangan</label>
                <select class="form-control mb-2" id="keterangan_pilih" name="keterangan_pilih" onchange="toggleKeteranganManual(this.value)">
                    <option value="">-- Kosong --</option>
                    <option value="DUPLIKASI">DUPLIKASI</option>
                    <option value="DITOLAK">DITOLAK</option>
                    <option value="PATAH">PATAH</option>
                    <option value="LD">LD</option>
                    <option value="ISI MANUAL">Lainnya (Isi Manual)...</option>
                </select>
                <input type="text" class="form-control" id="keterangan" name="keterangan" placeholder="Ketik keterangan..." style="display:none;">
            </div>
        </div>
        <div class="modal-footer justify-content-between bg-light">
          <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-primary" id="btnSave"><i class="fas fa-save"></i> Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal Import CSV -->
<div class="modal fade" id="modalImport">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success">
        <h4 class="modal-title">Import Data CSV</h4>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="importForm">
        <div class="modal-body">
            <div class="form-group">
                <label>Pilih File CSV</label>
                <div class="custom-file">
                    <input type="file" class="custom-file-input" id="csvFile" accept=".csv" required>
                    <label class="custom-file-label" for="csvFile">Pilih file...</label>
                </div>
                <small class="text-muted mt-2 d-block">Format kolom (tanpa header): Tgl(DD-MM-YYYY), No Permohonan, Nama, L/P, TP(1/0), TL(1/0), Keterangan</small>
            </div>
        </div>
        <div class="modal-footer justify-content-between bg-light">
          <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-success" id="btnImport"><i class="fas fa-upload"></i> Upload & Import</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- jQuery -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.1/js/bootstrap.bundle.min.js"></script>
<!-- DataTables & Plugins -->
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap4.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.2.9/js/responsive.bootstrap4.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="layout.js"></script>

<script>
    function toggleKeteranganManual(val) {
        if(val === 'ISI MANUAL') {
            $('#keterangan').show().val('').attr('required', true);
        } else {
            $('#keterangan').hide().val(val).removeAttr('required');
        }
    }

    var table;
    $(document).ready(function() {
        table = $('#dataTable').DataTable({
            "processing": true,
            "serverSide": false, // Karena pakai GAS, data diambil semua sekaligus
            "createdRow": function(row, data, dataIndex) {
                var ket = (data.keterangan || "").toUpperCase();
                if (ket.includes('DITOLAK') || ket.includes('DUPLIKASI')) {
                    $(row).addClass('table-danger');
                } else if (ket.includes('LD')) {
                    $(row).addClass('table-warning');
                }
            },
            "ajax": {
                "url": CONFIG.API_URL + "?table=permohonan",
                "type": "GET",
                "dataSrc": function (json) {
                    if (json.status !== 'success') {
                        Swal.fire('Error', json.message || 'Gagal memuat data', 'error');
                        return [];
                    }
                    // Tambahkan nomor urut
                    for (var i = 0; i < json.data.length; i++) {
                        json.data[i].no = i + 1;
                    }
                    return json.data;
                }
            },
            "responsive": true,
            "autoWidth": false,
            "language": {
                "url": "//cdn.datatables.net/plug-ins/1.11.5/i18n/id.json"
            },
            "columnDefs": [{ "defaultContent": "-", "targets": "_all" }], "columns": [
                { "data": "no", "orderable": false },
                { "data": "tgl_permohonan" },
                { "data": "no_permohonan" },
                { "data": "nama" },
                { "data": "jenis_kelamin" },
                { 
                    "data": "tp", 
                    "className": "text-center", 
                    "render": function(data) {
                        return data == 1 ? '<span class="badge badge-success"><i class="fas fa-check"></i></span>' : '-';
                    }
                },
                { 
                    "data": "tl", 
                    "className": "text-center", 
                    "render": function(data) {
                        return data == 1 ? '<span class="badge badge-success"><i class="fas fa-check"></i></span>' : '-';
                    }
                },
                { "data": "keterangan" },
                { "data": "recheck", "className": "text-center" },
                { "data": "status_cetak", "className": "text-center" },
                { 
                    "data": "id",
                    "className": "text-center", 
                    "orderable": false,
                    "render": function(data, type, row) {
                        // Simpan row data di atribut data-row untuk diedit
                        var rowData = encodeURIComponent(JSON.stringify(row));
                        return `
                            <button class="btn btn-xs btn-warning mb-1" onclick="editData('${rowData}')"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-xs btn-danger mb-1" onclick="deleteData('${data}')"><i class="fas fa-trash"></i></button>
                        `;
                    }
                }
            ]
        });

        $('#dataForm').on('submit', function(e) {
            e.preventDefault();
            $('#btnSave').prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Menyimpan...');

            var action = $('#action').val();
            var reqData = {
                tgl_permohonan: $('#tgl_permohonan').val(),
                no_permohonan: $('#no_permohonan').val(),
                nama: $('#nama').val(),
                jenis_kelamin: $('#jenis_kelamin').val(),
                tp: $('#tp').is(':checked') ? 1 : 0,
                tl: $('#tl').is(':checked') ? 1 : 0,
                keterangan: $('#keterangan').val()
            };

            var payload = {
                action: action,
                table: 'permohonan',
                data: reqData
            };

            if(action === 'update') {
                payload.id = $('#id').val();
            }

            fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8', // Plain text untuk avoid CORS preflight error di GAS
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(res => {
                if(res.status === 'success') {
                    $('#modal-form').modal('hide');
                    table.ajax.reload(null, false);
                    Swal.fire({ icon: 'success', title: 'Berhasil!', timer: 2000, showConfirmButton: false });
                } else {
                    Swal.fire('Gagal!', res.message, 'error');
                }
            })
            .catch(err => Swal.fire('Error', err.toString(), 'error'))
            .finally(() => $('#btnSave').prop('disabled', false).html('<i class="fas fa-save"></i> Simpan'));
        });

    window.showAddModal = function() {
        $('#dataForm')[0].reset();
        $('#action').val('insert');
        $('#modalTitle').text('Tambah Data Permohonan');
        $('#tp').prop('checked', false);
        $('#tl').prop('checked', false);
        $('#keterangan_pilih').val('');
        $('#keterangan').hide().val('');
        $('#modal-form').modal('show');
    }

    window.showImportModal = function() {
        $('#importForm')[0].reset();
        $('.custom-file-label').html('Pilih file...');
        $('#modalImport').modal('show');
    }

    $('#csvFile').on('change', function() {
        let fileName = $(this).val().split('\\\\').pop();
        $(this).next('.custom-file-label').addClass("selected").html(fileName);
    });

    $('#importForm').on('submit', function(e) {
        e.preventDefault();
        var file = document.getElementById('csvFile').files[0];
        if(!file) return;

        $('#btnImport').prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Memproses...');
        
        var reader = new FileReader();
        reader.onload = function(e) {
            var text = e.target.result;
            var lines = text.split(/\r?\n/);
            var rows = [];
            
            var separator = ',';
            if (lines.length > 0 && lines[0].indexOf(';') >= 0) {
                separator = ';';
            }
            
            for(var i=0; i<lines.length; i++) {
                if(lines[i].trim() === '') continue;
                var cols = lines[i].split(separator).map(c => c.trim().replace(/^"|"$/g, ''));
                
                if (i === 0 && cols[0].toUpperCase().includes('TGL')) continue; // Skip header
                
                if(cols.length >= 3) {
                    let dateStr = cols[0];
                    let dateParts = dateStr.split(/[-/]/);
                    if (dateParts.length === 3 && dateParts[0].length <= 2) {
                        dateStr = dateParts[2] + '-' + dateParts[1].padStart(2, '0') + '-' + dateParts[0].padStart(2, '0');
                    }
                    rows.push({
                        tgl_permohonan: dateStr,
                        no_permohonan: cols[1] || '',
                        nama: cols[2] || '',
                        jenis_kelamin: cols[3] || '',
                        tp: (cols[4] && (cols[4] == '1' || cols[4].toUpperCase() == 'TP')) ? 1 : 0,
                        tl: (cols[5] && (cols[5] == '1' || cols[5].toUpperCase() == 'TL')) ? 1 : 0,
                        keterangan: cols[6] || ''
                    });
                }
            }
            
            if(rows.length === 0) {
                Swal.fire('Gagal!', 'Tidak ada data valid di file CSV', 'error');
                $('#btnImport').prop('disabled', false).html('<i class="fas fa-upload"></i> Upload & Import');
                return;
            }
            
            fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'import',
                    table: 'permohonan',
                    rows: rows
                })
            })
            .then(r => r.json())
            .then(res => {
                if(res.status === 'success') {
                    $('#modalImport').modal('hide');
                    table.ajax.reload(null, false);
                    Swal.fire('Sukses!', res.count + ' data berhasil diimport!', 'success');
                } else {
                    Swal.fire('Gagal!', res.message, 'error');
                }
            })
            .catch(err => Swal.fire('Error', err.toString(), 'error'))
            .finally(() => $('#btnImport').prop('disabled', false).html('<i class="fas fa-upload"></i> Upload & Import'));
        };
        reader.readAsText(file);
    });
    
    // Penutup document ready
    });

    window.editData = function(encodedData) {
        var data = JSON.parse(decodeURIComponent(encodedData));
        $('#id').val(data.id);
        $('#tgl_permohonan').val(data.tgl_permohonan);
        $('#no_permohonan').val(data.no_permohonan);
        $('#nama').val(data.nama);
        $('#jenis_kelamin').val(data.jenis_kelamin);
        $('#tp').prop('checked', data.tp == 1);
        $('#tl').prop('checked', data.tl == 1);
        
        var ket = data.keterangan || '';
        if(ket == 'DUPLIKASI' || ket == 'DITOLAK' || ket == 'PATAH' || ket == 'LD' || ket == '') {
            $('#keterangan_pilih').val(ket);
            $('#keterangan').hide().val(ket);
        } else {
            $('#keterangan_pilih').val('ISI MANUAL');
            $('#keterangan').show().val(ket);
        }
        
        $('#action').val('update');
        $('#modalTitle').text('Edit Data Permohonan');
        $('#modal-form').modal('show');
    }

    window.deleteData = function(id) {
        Swal.fire({
            title: 'Apakah anda yakin?', text: "Data yang dihapus tidak dapat dikembalikan!", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6', confirmButtonText: 'Ya, hapus!', cancelButtonText: 'Batal'
        }).then((result) => {
            if (result.isConfirmed) {
                var payload = {
                    action: 'delete',
                    table: 'permohonan',
                    id: id
                };

                fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                })
                .then(r => r.json())
                .then(res => {
                    if(res.status === 'success') {
                        table.ajax.reload(null, false);
                        Swal.fire({ icon: 'success', title: 'Terhapus!', timer: 2000, showConfirmButton: false });
                    } else { Swal.fire('Gagal!', res.message, 'error'); }
                });
            }
        });
    }
</script>
</body>
</html>
