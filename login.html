<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIREKAP v2 | Sistem Autentikasi Cloud</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        background-size: cover;
        position: relative;
        overflow: hidden;
    }
    .shape {
        position: absolute;
        filter: blur(80px);
        z-index: 1;
        opacity: 0.6;
    }
    .shape-1 {
        top: -150px; left: -150px;
        width: 400px; height: 400px;
        background: #00d2ff;
        border-radius: 50%;
        animation: float 8s infinite alternate ease-in-out;
    }
    .shape-2 {
        bottom: -150px; right: -100px;
        width: 500px; height: 500px;
        background: #3a7bd5;
        border-radius: 50%;
        animation: float 10s infinite alternate-reverse ease-in-out;
    }
    @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(50px, 50px) scale(1.1); }
    }
    .login-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 420px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .brand-logo { text-align: center; margin-bottom: 35px; }
    .brand-logo h1 {
        font-size: 36px; font-weight: 700;
        color: #ffffff; letter-spacing: 2px;
        margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .brand-logo h1 span { color: #00d2ff; }
    .brand-logo p { color: rgba(255, 255, 255, 0.8); font-size: 14px; font-weight: 300; }
    .form-group { position: relative; margin-bottom: 25px; }
    .form-control {
        width: 100%; padding: 15px 15px 15px 50px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px; color: #fff; font-size: 15px; outline: none;
    }
    .form-control::placeholder { color: rgba(255, 255, 255, 0.5); }
    .form-control:focus {
        background: rgba(255, 255, 255, 0.15);
        border-color: #00d2ff; box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }
    .input-icon {
        position: absolute; top: 50%; left: 20px;
        transform: translateY(-50%); color: rgba(255, 255, 255, 0.6); font-size: 18px;
    }
    .form-control:focus + .input-icon { color: #00d2ff; }
    .btn-login {
        width: 100%; padding: 15px;
        background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
        border: none; border-radius: 12px; color: #fff;
        font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(0, 210, 255, 0.4); }
    .alert {
        background: rgba(255, 71, 87, 0.2); border: 1px solid rgba(255, 71, 87, 0.4);
        color: #ff6b81; padding: 12px 15px; border-radius: 10px;
        margin-bottom: 25px; font-size: 14px; text-align: center;
        display: none; align-items: center; justify-content: center; gap: 10px;
    }
    .footer-text { text-align: center; margin-top: 30px; color: rgba(255, 255, 255, 0.5); font-size: 12px; }
  </style>
</head>
<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="login-container">
        <div class="brand-logo">
            <h1>SI<span>REKAP</span> v2</h1>
            <p>Vercel Cloud & Google Sheets Data</p>
        </div>

        <div class="alert" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <input type="text" class="form-control" id="username" placeholder="Username" required autofocus>
                <i class="fas fa-user input-icon"></i>
            </div>
            
            <div class="form-group">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <i class="fas fa-lock input-icon"></i>
            </div>
            
            <button type="submit" class="btn-login" id="btnSubmit">
                Masuk ke Cloud Dashboard <i class="fas fa-arrow-right ml-2" style="margin-left: 8px;"></i>
            </button>
        </form>

        <div class="footer-text">
            &copy; 2026 SIREKAP Cloud (Vercel).
        </div>
    </div>

<script src="config.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const btnSubmit = document.getElementById('btnSubmit');
        const alertBox = document.getElementById('errorMessage');
        
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = 'Memverifikasi... <i class="fas fa-spinner fa-spin"></i>';
        
        try {
            const payload = { action: 'login', table: 'users', username: username, password: password };
            const res = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            
            const data = await res.json();
            
            if (data.status === 'success') {
                localStorage.setItem('sirekap_token', data.token);
                localStorage.setItem('sirekap_role', data.role);
                window.location.href = 'index.html';
            } else {
                alertBox.style.display = 'flex';
                document.getElementById('errorText').innerText = data.message;
            }
        } catch (err) {
            alertBox.style.display = 'flex';
            document.getElementById('errorText').innerText = 'Tidak dapat terhubung ke server Vercel.';
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = 'Masuk ke Cloud Dashboard <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>';
        }
    });
</script>
</body>
</html>
